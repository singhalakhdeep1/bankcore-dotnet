<mat-toolbar color="primary" *ngIf="authService.isAuthenticated()">
  <span>Banking App</span>
  <span class="spacer"></span>

  <button mat-button routerLink="/dashboard">
    <mat-icon>dashboard</mat-icon>
    Dashboard
  </button>

  <button mat-button routerLink="/accounts">
    <mat-icon>account_balance</mat-icon>
    Accounts
  </button>

  <button mat-button routerLink="/payment-methods">
    <mat-icon>credit_card</mat-icon>
    Cards
  </button>

  <button mat-button routerLink="/recurring">
    <mat-icon>event_repeat</mat-icon>
    Recurring
  </button>

  <button mat-button routerLink="/admin" *ngIf="isStaff">
    <mat-icon>admin_panel_settings</mat-icon>
    Back office
  </button>

  <button mat-icon-button [matMenuTriggerFor]="menu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item disabled>
      <mat-icon>person</mat-icon>
      <span>{{ authService.currentUserValue?.email }}</span>
    </button>
    <button mat-menu-item routerLink="/profile">
      <mat-icon>manage_accounts</mat-icon>
      <span>Profile &amp; security</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
