<div class="accounts-container">
  <div class="header">
    <h1>My Accounts</h1>
    <button mat-raised-button color="primary" (click)="createAccount()">
      <mat-icon>add</mat-icon>
      New Account
    </button>
  </div>

  <mat-spinner *ngIf="loading" class="loading-spinner"></mat-spinner>

  <mat-card *ngIf="!loading && accounts.length === 0">
    <mat-card-content>
      <p>No accounts found. Create your first account!</p>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="!loading && accounts.length > 0">
    <table mat-table [dataSource]="accounts" class="accounts-table">
      <ng-container matColumnDef="accountNumber">
        <th mat-header-cell *matHeaderCellDef>Account Number</th>
        <td mat-cell *matCellDef="let account">{{ account.accountNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="accountType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let account">{{ account.accountType }}</td>
      </ng-container>

      <ng-container matColumnDef="balance">
        <th mat-header-cell *matHeaderCellDef>Balance</th>
        <td mat-cell *matCellDef="let account">
          {{ account.balance | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="currency">
        <th mat-header-cell *matHeaderCellDef>Currency</th>
        <td mat-cell *matCellDef="let account">{{ account.currency }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let account">
          <span
            class="status-badge"
            [class.active]="account.status === 'Active'"
          >
            {{ account.status }}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>
</div>
